name: cloud-editor-prod

services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  realtime:
    build:
      context: .
      dockerfile: packages/realtime/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      REALTIME_PORT: "4001"
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
    expose:
      - "4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: packages/runner/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      RUNNER_PORT: "4002"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      RUNNER_MAX_TIMEOUT_MS: ${RUNNER_MAX_TIMEOUT_MS:-30000}
      RUNNER_MAX_MEMORY_MB: ${RUNNER_MAX_MEMORY_MB:-256}
      RUNNER_MAX_CPU: ${RUNNER_MAX_CPU:-0.5}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
    expose:
      - "4002"
    cpus: "${RUNNER_MAX_CPU:-0.5}"
    mem_limit: "${RUNNER_MAX_MEMORY_MB:-256}M"
    deploy:
      resources:
        limits:
          cpus: "${RUNNER_MAX_CPU:-0.5}"
          memory: "${RUNNER_MAX_MEMORY_MB:-256}M"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    restart: unless-stopped
